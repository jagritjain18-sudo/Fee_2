<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .box {
      width: 380px;
      height: 520px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .box:hover {
      transform: scale(1.03);
    }

    p {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      letter-spacing: 1px;
    }

    .memebox {
  width: 100%;
  height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;         
  border-radius: 15px;
  background: #f9f9f9;      
}

.memebox img {
  max-width: 100%;           
  max-height: 100%;          
  object-fit: contain;       
  border-radius: 10px;
  cursor: pointer;
}


    .memebox img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="box">
    <p> Click To Change Meme </p>
    <div class="memebox">
          
          <img id="meme" src="" alt="Meme">

        </div>
  </div>
  <script src="page.js"></script>
</body>
</html>
